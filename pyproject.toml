[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragwatch"
version = "0.6.0"
description = "Runtime monitoring and diagnosis framework for Retrieval-Augmented Generation systems"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18.0"]
vectordb = [
    "chromadb>=0.5.0",
    "qdrant-client>=1.9.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.5",
    "sentence-transformers>=2.7.0",
]
otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
]
plots = [
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
semantic = [
    "sentence-transformers>=2.7.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# RAGWatch Grafana Tempo configuration (minimal, local storage)
#
# Receives traces over OTLP/gRPC from the OpenTelemetry Collector and stores
# them on the local filesystem inside the container.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
